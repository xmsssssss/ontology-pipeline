services:
  graphdb:
    image: ontotext/graphdb:10.8.6
    container_name: regulation-graphdb
    restart: unless-stopped
    ports:
      - "7200:7200"
      - "7300:7300"
    environment:
      GRAPHDB_JAVA_OPTS: "-Xms1g -Xmx2g"
    volumes:
      - graphdb-data:/opt/graphdb/home
      - graphdb-work:/opt/graphdb/work

volumes:
  graphdb-data:
  graphdb-work:
